plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

dependencies {
    implementation files('libs/trusttunnel-client-android-1.1.7.aar')
    implementation 'org.slf4j:slf4j-api:1.7.25'
    implementation 'com.github.tony19:logback-android:2.0.0'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.0'
    implementation 'com.akuleshov7:ktoml-core:0.7.0'
    implementation 'org.tomlj:tomlj:1.1.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    implementation 'androidx.core:core-ktx:1.16.0'
    testImplementation 'junit:junit:4.13.2'
}

android {
    namespace 'org.freetunnel.android'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'org.freetunnel.android'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 4
        versionName '0.4.0'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            def path = System.getenv('ANDROID_KEYSTORE_PATH')
            if (path) {
                storeFile file(path)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = '11' }
}

tasks.register('verifyPinnedRuntime') {
    def artifact = file('libs/trusttunnel-client-android-1.1.7.aar')
    inputs.file(artifact)
    doLast {
        if (!artifact.exists()) throw new GradleException('Run ../scripts/prepare-trusttunnel-android.sh first')
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
        if (digest != '5398df61f74610d1d63819059bb596560feb51882e9ca78609df32fc4c7840f7') {
            throw new GradleException('TrustTunnel AAR checksum mismatch')
        }
    }
}
tasks.named('preBuild') { dependsOn('verifyPinnedRuntime') }
