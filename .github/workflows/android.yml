name: Android
on:
  push:
    paths: ['android/**', 'scripts/prepare-trusttunnel-android.sh', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'scripts/prepare-trusttunnel-android.sh', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: scripts/prepare-trusttunnel-android.sh
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-preview
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/reports/
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: scripts/prepare-trusttunnel-android.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            cd android
            ./gradlew --no-daemon :app:installDebug :app:installDebugAndroidTest
            adb shell appops set org.freetunnel.android ACTIVATE_VPN allow
            adb shell pm grant org.freetunnel.android android.permission.POST_NOTIFICATIONS
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-results
          path: android/app/build/reports/androidTests/
